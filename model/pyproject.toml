[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iceberg-drift"
version = "0.1.0"
description = "AI-enabled Antarctic iceberg drift prediction for navigation decision support"
readme = "README.md"
authors = [{name = "Antarctic Navigation DSS Team"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=1.7.0",
    "lightgbm>=4.0.0",
    "optuna>=3.4.0",
    "xarray>=2023.1.0",
    "netcdf4>=1.6.0",
    "h5netcdf>=1.1.0",
    "zarr>=2.16.0",
    "s3fs>=2023.9.0",
    "cdsapi>=0.5.0",
    "copernicusmarine>=1.0.0",
    "geopandas>=0.13.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "folium>=0.15.0",
    "contextily>=1.5.0",
    "cartopy>=0.22.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "tqdm>=4.65.0",
    "joblib>=1.3.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.1.0",
    "torch>=2.0.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "hypothesis>=6.80.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
    "pyinstrument>=4.6.0",
    "snakeviz>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["iceberg_drift*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008"]
exclude = ["output/", "models/", "data/", "__pycache__/", ".venv/"]

[tool.black]
line-length = 100
target-version = ["py310"]
include = "\\.pyi?$"
exclude = "\\.ipynb"

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true