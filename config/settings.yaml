paths:
  raw_data: "/Users/pratiksmac/Downloads/icccy/data"
  models: "/Users/pratiksmac/Downloads/icccy/output/models"
  output: "/Users/pratiksmac/Downloads/icccy/output"

data_sources:
  iceberg_positions:
    source: "SYNTHETIC"  # Using synthetic data for initial training
    start_date: "2015-01-01"
    end_date: "2015-01-31"
    min_length_m: 100
    local_path: "/Users/pratiksmac/Downloads/icccy/data"
  era5_wind:
    bbox: [-65, -65, -50, -55]
  ocean_currents:
    bbox: [-65, -65, -50, -55]

model:
  type: pinn
  ml_correction:
    prediction_horizon: 6
    hidden_dim: 64
    num_layers: 2
    dropout: 0.1
  pinn:
    physics_weight: 0.5
    boundary_weight: 0.1
    wind_factor: 0.02
    coriolis_alpha: 0.015

training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 1e-5
  optimizer: adamw
  scheduler: cosine
  scheduler_params:
    eta_min: 1e-6
  early_stopping_patience: 5
  early_stopping_metric: val_loss
  gradient_clip: 1.0
  use_amp: false
  log_interval: 1
  save_interval: 2
  validate_every: 1
  teacher_forcing:
    initial: 0.5
    final: 0.0
    decay: linear
  metric_horizons: [6, 12]

evaluation:
  bootstrap_samples: 10
  confidence_level: 0.95
  metric_horizons: [6, 12]
  baseline_comparison: true

visualization:
  plot_style: seaborn-v0_8
  figure_size: [10, 6]
  dpi: 100
  save_format: [png]