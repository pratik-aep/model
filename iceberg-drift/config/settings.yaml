# Canonical configuration for real training runs (Jan-2015 BYU_LOCAL PINN)
paths:
  raw_data: "/Users/pratiksmac/Downloads/data"
  processed_data: output/processed
  models: output/checkpoints
  results: output/results
  logs: output/logs

data_sources:
  iceberg_positions:
    source: "BYU_LOCAL"
    local_path: "/Users/pratiksmac/Downloads/data"
    start_date: "2019-01-01"
    end_date: "2026-12-31"
    min_length_m: 100
  era5_wind:
    variable: 10m_wind
  ocean_currents:
    variable: surface_currents
  bathymetry:
    source: "IBCSO_v2"
    local_path: "/Users/pratiksmac/Downloads/data/raw/bathymetry/IBCSO_v2_bed_WGS84.nc"

model:
  type: pinn
  ml_correction:
    prediction_horizon: 6
    sequence_length: 24
    hidden_dim: 64
    num_layers: 2
    dropout: 0.1
    loss_weights:
      physics: 0.5
      boundary: 0.1
  pinn:
    physics_weight: 0.5
    boundary_weight: 0.1
    wind_factor: 0.02
    coriolis_alpha: 0.015

training:
  epochs: 100
  batch_size: 32
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  random_seed: 42
  learning_rate: 0.001
  weight_decay: 1e-5
  optimizer: adamw
  scheduler: cosine
  scheduler_params:
    eta_min: 1e-6
  early_stopping_patience: 5
  early_stopping_metric: val_loss
  gradient_clip: 1.0
  use_amp: false
  log_interval: 1
  save_interval: 2
  validate_every: 1
  teacher_forcing:
    initial: 0.5
    final: 0.0
    decay: linear
  metric_horizons: [6, 12]

evaluation:
  bootstrap_samples: 10
  confidence_level: 0.95
  metric_horizons: [6, 12]
  baseline_comparison: true

visualization:
  plot_style: seaborn-v0_8
  figure_size: [10, 6]
  dpi: 100
  save_format: [png]
