# Configuration for unit tests and CI
paths:
  raw_data: data/raw
  processed_data: data/processed
  models: output/checkpoints
  results: output/results
  logs: output/logs

data_sources:
  iceberg_positions:
    source: SYNTHETIC
    min_length_m: 100
  era5_wind:
    variable: 10m_wind
  copernicus_currents:
    variable: surface_currents

model:
  type: pinn
  ml_correction:
    prediction_horizon: 6  # shorter horizon for quick test
    hidden_dim: 64
    num_layers: 2
    dropout: 0.1
  pinn:
    physics_weight: 0.5
    boundary_weight: 0.1
    wind_factor: 0.02
    coriolis_alpha: 0.015

training:
  epochs: 2  # very few epochs
  batch_size: 2  # small batch
  learning_rate: 0.001
  weight_decay: 1e-5
  optimizer: adamw
  scheduler: cosine
  scheduler_params:
    eta_min: 1e-6
  early_stopping_patience: 5
  early_stopping_metric: val_loss
  gradient_clip: 1.0
  use_amp: false  # disable AMP for simplicity
  log_interval: 1
  save_interval: 2
  validate_every: 1
  teacher_forcing:
    initial: 0.5
    final: 0.0
    decay: linear
  metric_horizons: [6, 12]  # shorter horizons

evaluation:
  bootstrap_samples: 10  # few for quick test
  confidence_level: 0.95
  metric_horizons: [6, 12]
  baseline_comparison: true

visualization:
  plot_style: seaborn-v0_8
  figure_size: [10, 6]
  dpi: 100
  save_format: [png]